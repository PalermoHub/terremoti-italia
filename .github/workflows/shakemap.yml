name: ShakeMap INGV
# Copia i contorni GeoJSON delle ShakeMap nel ramo `shakemap` (shakemap.ingv.it non ha CORS). Il ramo è incrementale: ogni giro aggiunge gli eventi nuovi e riscrive solo quelli recenti.
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: shakemap
jobs:
  shakemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Estrai il ramo shakemap (se esiste)
        run: |
          if git ls-remote --exit-code --heads origin shakemap >/dev/null 2>&1; then
            git worktree add --detach "$RUNNER_TEMP/shakemap" origin/shakemap
          else
            mkdir "$RUNNER_TEMP/shakemap" && git -C "$RUNNER_TEMP/shakemap" init -q -b shakemap
          fi
      - run: node --no-warnings scripts/shakemap.mjs "$RUNNER_TEMP/shakemap"
      - name: Pubblica nel ramo shakemap
        working-directory: ${{ runner.temp }}/shakemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nessuna novità"; exit 0; }
          git commit -q -m "ShakeMap $(date -u +%FT%TZ)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/shakemap
