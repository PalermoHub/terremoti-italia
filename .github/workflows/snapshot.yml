name: Snapshot dati
# Rigenera terremoti.json e allerte.json e li pubblica nel ramo `snapshot` (un solo commit, riscritto ogni volta: la cronologia di main non cresce).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --no-warnings scripts/snapshot.mjs "$RUNNER_TEMP/snapshot"
      - name: Pubblica nel ramo snapshot
        working-directory: ${{ runner.temp }}/snapshot
        run: |
          git init -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Snapshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot
